name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and commit github-metrics.svg to the metrics branch
        uses: lowlighter/metrics@latest
        with:
          # GITHUB_TOKEN is enough for the panels below. For richer plugins
          # (private-repo stats, etc.) create a classic PAT with scopes
          # `repo` + `read:user` and add it as a secret named METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: MrKMJ
          filename: github-metrics.svg
          committer_branch: metrics
          committer_message: "Update github-metrics.svg"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
